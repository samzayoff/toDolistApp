<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <script src="https://kit.fontawesome.com/0d2181fadc.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous" />
    <script defer src="./script.js"></script>
    <title>Sign Up</title>

    <style>
        body {
            background: #eef1f7;
            font-family: 'Poppins', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .custom-form {
            background-color: #ffffff;
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
            border: 7px solid rgba(0, 0, 0, 0.199);
        }

        .form-title {
            text-align: center;
            margin-bottom: 2rem;
            color: #333;
        }

        .custom-form .form-group,
        .custom-form .form-check {
            margin-bottom: 1.5rem;
        }

        .custom-form label {
            font-weight: 500;
            margin-bottom: 0.5rem;
            display: block;
            color: #444;
        }

        .custom-form .form-control {
            border-radius: 0.5rem;
            border: 1px solid #ccc;
            padding: 0.6rem;
            font-size: 1rem;
        }

        .custom-form .form-control:focus {
            border-color: #007bff;
            box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, .25);
        }

        .custom-form .btn-primary {
            background-color: rgba(0, 0, 0, 0.199);
            border: none;
            color: black;
            padding: 0.6rem 1.2rem;
            border-radius: 0.5rem;
            font-weight: bold;
            width: 100%;
            transition: background-color 0.3s ease;
        }

        .custom-form .btn-primary:hover {
            background-color: #0056b3;
            color: wheat;
        }
    </style>
</head>

<body>
    <center>
        <h2><b>Create an Account</b></h2>
    </center>
    <br />
    <form class="custom-form needs-validation" novalidate>
        <h2 class="form-title"><b>Sign Up</b></h2>

        <div class="form-group">
            <label for="inputUsername">Username:</label>
            <input type="text" class="form-control" id="inputUsername" placeholder="Your username" required
                autocomplete="off" />
            <div class="invalid-feedback">Please enter a username.</div>
        </div>

        <div class="form-group">
            <label for="inputEmail">Email address:</label>
            <input type="email" class="form-control" id="inputEmail" placeholder="abc@gmail.com" required
                autocomplete="off" />
            <div class="invalid-feedback">Please enter a valid email.</div>
        </div>

        <div class="form-group">
            <label for="inputPassword">Password:</label>
            <input type="password" class="form-control" id="inputPassword" placeholder="*********" required
                autocomplete="off" />
            <div class="invalid-feedback">Please enter a password.</div>
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirm Password:</label>
            <input type="password" class="form-control" id="confirmPassword" placeholder="*********" required
                autocomplete="off" />
            <div class="invalid-feedback">Please confirm your password.</div>
        </div>

        <button class="btn btn-primary" type="submit">Sign Up</button>
        <br /><br />
        <center>
            <p>Already have an account? <a href="./index.html">Login here</a></p>
        </center>
    </form>
    <script>
        // Prevent back/forward navigation
        history.pushState(null, null, location.href);
        window.onpopstate = () => history.go(1);

        document.querySelector("form").addEventListener("submit", function (e) {
            e.preventDefault();

            const username = document.getElementById("inputUsername").value.trim();
            const email = document.getElementById("inputEmail").value.trim();
            const password = document.getElementById("inputPassword").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            if (password !== confirmPassword) {
                alert("Passwords do not match!");
                return;
            }

            let users = JSON.parse(localStorage.getItem("users")) || {};
            if (users[username]) {
                alert("Username already exists!");
                return;
            }

            users[username] = {
                email,
                password: btoa(password), // Simple encoding (not secure for production)
                tasks: []
            };

            localStorage.setItem("users", JSON.stringify(users));
            alert("Signup successful! Redirecting to login...");
            window.location.href = "index.html";
        });
    </script>

</body>

</html>
